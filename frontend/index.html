<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Shiftech AI Assistant</title>
  </head>
  <body>
    <div id="shiftech-chatbot-widget">
      <!-- 1. Bottom Right Launcher Widget (Appears when input space is canceled) -->
      <button
        id="chat-widget-launcher"
        title="Open Shiftech Assistant"
        aria-label="Open Shiftech Assistant"
      >
        <span class="launcher-badge"></span>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="26"
          height="26"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
          />
        </svg>
      </button>

      <!-- 2. Main Center Container (Bottom Center by Default) -->
      <div id="chat-container">
        <!-- Text Link / Suggestion Container (Only visible when input is active) -->
        <div id="suggestion-card">
          <button
            class="suggestion-item"
            data-prompt="How can I try Shiftech products for free?"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M9 18l6-6-6-6" />
            </svg>
            <span>How can I try Shiftech products for free?</span>
          </button>
          <button
            class="suggestion-item"
            data-prompt="How do I build and use AI agents?"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M9 18l6-6-6-6" />
            </svg>
            <span>How do I build and use AI agents?</span>
          </button>
          <button
            class="suggestion-item"
            data-prompt="Summarize what's new with Shiftech AI"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M9 18l6-6-6-6" />
            </svg>
            <span>Summarize what's new with Shiftech AI</span>
          </button>
        </div>

        <!-- Chat Box Panel -->
        <div id="chat-box-panel">
          <!-- Expanded Top Header -->
          <div id="chat-top-section">
            <div style="display: flex; align-items: center">
              <img src="logo.png" alt="Shiftech Logo" />
              <h3>Shiftech Assistant</h3>
            </div>
            <div class="header-controls">
              <button id="minimizeBtn" class="icon-btn" title="Minimize">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="4 14 10 14 10 20" />
                  <polyline points="20 10 14 10 14 4" />
                  <line x1="14" y1="10" x2="21" y2="3" />
                  <line x1="3" y1="21" x2="10" y2="14" />
                </svg>
              </button>
              <button id="closeHeaderBtn" class="icon-btn" title="Cancel Chat">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <line x1="18" y1="6" x2="6" y2="18" />
                  <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Scrollable Chat Window -->
          <div id="chat-window"></div>

          <!-- Bottom Input Pill Bar -->
          <div id="input-area">
            <input
              type="text"
              id="queryInput"
              placeholder="Ask Shiftech Assistant..."
            />
            <div class="input-actions">
              <button id="cancelBtn" title="Cancel / Minimize to Widget">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <line x1="18" y1="6" x2="6" y2="18" />
                  <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
              </button>
              <button id="sendBtn" title="Send Message">
                <svg
                  viewBox="0 0 24 24"
                  width="20"
                  height="20"
                  fill="currentColor"
                >
                  <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const API_local = "https://d07e-197-248-215-13.ngrok-free.app";

        let sessionId = "";
        let sessionPromise = null;
        let hasConversation = false;

        const root = document.getElementById("shiftech-chatbot-widget");
        const container = root.querySelector("#chat-container");
        const launcher = root.querySelector("#chat-widget-launcher");
        const suggestionCard = root.querySelector("#suggestion-card");
        const queryInput = root.querySelector("#queryInput");
        const sendBtn = root.querySelector("#sendBtn");
        const cancelBtn = root.querySelector("#cancelBtn");
        const minimizeBtn = root.querySelector("#minimizeBtn");
        const closeHeaderBtn = root.querySelector("#closeHeaderBtn");
        const chatWindow = root.querySelector("#chat-window");
        const suggestionItems = root.querySelectorAll(".suggestion-item");

        // 1. Show text link container ONLY when input space is active / focused
        queryInput.addEventListener("focus", function () {
          if (!container.classList.contains("expanded")) {
            suggestionCard.classList.add("active");
          }
        });

        // Hide text link container when user clicks outside the widget
        document.addEventListener("click", function (e) {
          if (!root.contains(e.target)) {
            suggestionCard.classList.remove("active");
          }
        });

        // 2. Cancel Input Space -> Moves to Bottom Right Widget
        function cancelInputSpace(e) {
          if (e) e.stopPropagation();
          suggestionCard.classList.remove("active");
          container.classList.add("hidden");
          launcher.classList.add("visible");
        }

        // 3. Click Bottom Right Widget -> Restores Input Space to Bottom Center & Focuses Input
        function restoreInputSpace(e) {
          if (e) e.stopPropagation();
          launcher.classList.remove("visible");
          container.classList.remove("hidden");
          queryInput.focus();
        }

        // Expand container into full chat view
        function expandChat() {
          if (!container.classList.contains("expanded")) {
            container.classList.add("expanded");
          }
          suggestionCard.classList.remove("active");
        }

        // Minimize expanded view back to bottom center pill
        function minimizeChat(e) {
          if (e) e.stopPropagation();
          container.classList.remove("expanded");
          suggestionCard.classList.remove("active");
        }

        async function initSession() {
          if (sessionId) return sessionId;
          if (!sessionPromise) {
            sessionPromise = (async () => {
              try {
                const res = await fetch(`${API_local}/start-session`, {
                  method: "POST",
                });
                const data = await res.json();
                if (res.ok && data.session_id) {
                  sessionId = data.session_id;
                  return sessionId;
                }
              } catch (err) {
                console.warn("Could not reach session endpoint:", err);
              }
              return "demo-session";
            })();
          }
          return sessionPromise;
        }

        async function sendMessage(promptText, event) {
          if (event) event.stopPropagation();

          const textToSend = promptText || queryInput.value.trim();
          if (!textToSend) return;

          hasConversation = true;
          expandChat();

          chatWindow.innerHTML += `<div class="shiftech-message shiftech-user">${escapeHtml(textToSend)}</div>`;
          queryInput.value = "";
          sendBtn.disabled = true;

          const aiMessageId = "ai-msg-" + Date.now();
          chatWindow.innerHTML += `
            <div class="shiftech-message shiftech-ai" id="${aiMessageId}">
                <div class="shiftech-loader">
                    <div class="shiftech-dot"></div>
                    <div class="shiftech-dot"></div>
                    <div class="shiftech-dot"></div>
                </div>
            </div>`;
          chatWindow.scrollTop = chatWindow.scrollHeight;

          try {
            await initSession();

            const res = await fetch(`${API_local}/chat`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ query: textToSend, session_id: sessionId }),
            });
            const data = await res.json();

            if (!res.ok) {
              throw new Error(
                data.detail || "The assistant could not respond right now.",
              );
            }

            const aiBubble = root.querySelector(`#${aiMessageId}`);
            aiBubble.innerHTML = escapeHtml(data.response || "").replace(/\n/g, "<br>");
          } catch (error) {
            const aiBubble = root.querySelector(`#${aiMessageId}`);
            aiBubble.innerHTML =
              escapeHtml(error.message || "The assistant could not respond right now.");
            console.error(error);
          } finally {
            sendBtn.disabled = false;
            chatWindow.scrollTop = chatWindow.scrollHeight;
          }
        }

        function escapeHtml(str) {
          return str
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        // Event Listeners
        cancelBtn.addEventListener("click", cancelInputSpace);
        closeHeaderBtn.addEventListener("click", cancelInputSpace);
        launcher.addEventListener("click", restoreInputSpace);
        minimizeBtn.addEventListener("click", minimizeChat);

        queryInput.addEventListener("keypress", function (event) {
          if (event.key === "Enter") {
            sendMessage(null, event);
          }
        });

        sendBtn.addEventListener("click", function (event) {
          sendMessage(null, event);
        });

        suggestionItems.forEach((item) => {
          item.addEventListener("click", function (event) {
            const prompt = this.getAttribute("data-prompt");
            sendMessage(prompt, event);
          });
        });

        initSession();
      })();
    </script>
  </body>
</html>
